name: Deploy
on:
  push: { branches: [main] }
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Sync kode ke ~/apps/demo-be
        run: rsync -a --delete --exclude node_modules --exclude .env "$GITHUB_WORKSPACE/" "$HOME/apps/demo-be/"
      - name: Rebuild & restart backend
        run: docker compose -f "$HOME/deploy-demo/docker-compose.yml" up -d --build demo-be
